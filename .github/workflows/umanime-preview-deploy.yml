name: (Preview) Release and Deploy UMAnime
# This only works on preview branch, will be updated once other branches are in use when own domain is achieved

on:
  push:
    branches:
      - preview
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  build:
    name: Preview Build
    runs-on: ubuntu-latest
    needs: 
      - eslint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Website (Next.js)
        run: npm run build

  audit:
    name: Node Package Manager Security Audit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  deploy:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs: 
      - eslint
      - audit
      - build

    steps:
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.UMANIME_SSH_KEY }}" > ~/.ssh/umanime_key
          chmod 600 ~/.ssh/umanime_key

      - name: Deploy to VM
        run: |
          ssh -i ~/.ssh/umanime_key \
            -o ProxyCommand="cloudflared access ssh --hostname ${{ secrets.UMANIME_HOST }} --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.UMANIME_SSH_USER }}@${{ secrets.UMANIME_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.UMANIME_PATH }}

            git fetch origin
            git checkout preview
            git pull origin preview

            npm ci
            npm run build

            sudo systemctl restart umanime-web
            sudo systemctl status umanime-web --no-pager
          EOF